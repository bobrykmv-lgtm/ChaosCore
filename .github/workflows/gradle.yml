name: Build ChaosCore

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build ChaosCore
        run: gradle -p ChaosCore-source clean build

      - name: Upload ChaosCore JAR
        uses: actions/upload-artifact@v4
        with:
          name: ChaosCore-1.0.0
          path: ChaosCore-source/build/libs/ChaosCore-1.0.0.jar
          if-no-files-found: error
