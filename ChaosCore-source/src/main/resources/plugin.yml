```yaml
name: ChaosCore
version: 1.1.0
main: com.chaossmp.chaoscore.ChaosCore
api-version: '1.21'
author: ChaosSMP
description: Система хаоса, убийств, пяти уровней силы и статистики игроков.

commands:
  chaos:
    description: Просмотр хаоса и таблицы лидеров.
    usage: /chaos [top]
    permission: chaoscore.use

permissions:
  chaoscore.use:
    description: Позволяет использовать команду /chaos.
    default: true
```
