name: ChaosCore
version: 1.0.0
main: com.chaossmp.chaoscore.ChaosCore
api-version: '1.21'
author: ChaosSMP
description: Основная система хаосов сервера ChaosSMP

commands:
chaos:
description: Система хаосов
usage: /chaos [top|stats|give|take|set|check|reload|history]
aliases:
- хаос

permissions:
chaoscore.use:
description: Использование системы хаосов
default: true

chaoscore.admin:
description: Административное управление хаосами
default: op
