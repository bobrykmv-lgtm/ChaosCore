name: Build ChaosCore

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download source
        uses: actions/checkout@v4

      - name: Install Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build plugin
        run: gradle -p ChaosCore-source build

      - name: Save plugin
        uses: actions/upload-artifact@v4
        with:
          name: ChaosCore
          path: ChaosCore-source/build/libs/*.jar
